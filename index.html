<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foggy Glass</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- The WebGL Canvas for rendering the scene and fog -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- Hidden video element for MediaPipe webcam feed -->
    <video id="webcam" autoplay playsinline style="display: none;"></video>

    <!-- Overlay for initial interactions (required to start audio/video) -->
    <div id="overlay" class="overlay">
      <div class="content">
        <h1>Foggy Glass</h1>
        <p class="subtitle">An interactive reveal experience</p>
        <p class="instructions">Wipe with your hand. Blow gently to clear the mist.</p>
        <button id="start-btn">Enter</button>
      </div>
    </div>
    
    <!-- Hidden glowing text that gets rendered onto a 2D texture for the background scene -->
    <div id="hidden-text-container" style="display: none;">
      <div class="poetic-text">for you</div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
